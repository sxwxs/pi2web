# Put the map directive in nginx's `http {}` context.
# The two server blocks can then be included from sites-enabled.
#
# Deploy: copy `public/` to /srv/pi2web-website/public and
# `nginx/security-headers.conf` to /etc/nginx/snippets/pi2web-site-security-headers.conf

map $http_accept_language $pi2web_site_language {
    default en;
    ~*^zh(?:[-_]|[,;]|$) zh;
}

limit_req_zone $binary_remote_addr zone=pi2web_site_reads:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name pi2web.es2q.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pi2web.es2q.com;

    # Adjust these paths for your ACME/certificate setup.
    ssl_certificate     /etc/letsencrypt/live/pi2web.es2q.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pi2web.es2q.com/privkey.pem;

    root /srv/pi2web-website/public;
    index index.html;
    access_log /var/log/nginx/pi2web.es2q.com.access.log;
    error_log  /var/log/nginx/pi2web.es2q.com.error.log warn;

    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/snippets/pi2web-site-security-headers.conf;

    # Language negotiation only applies at the root. Localized URLs stay stable
    # so they can be linked and indexed directly.
    location = / {
        include /etc/nginx/snippets/pi2web-site-security-headers.conf;
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "no-store" always;
        return 302 /$pi2web_site_language/;
    }
    location = /index.html {
        include /etc/nginx/snippets/pi2web-site-security-headers.conf;
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "no-store" always;
        return 302 /$pi2web_site_language/;
    }
    location = /zh { return 308 /zh/; }
    location = /en { return 308 /en/; }

    location ^~ /zh/ {
        include /etc/nginx/snippets/pi2web-site-security-headers.conf;
        add_header Content-Language "zh-CN" always;
        add_header Cache-Control "public, max-age=300";
        limit_req zone=pi2web_site_reads burst=20 nodelay;
        try_files $uri $uri/ $uri/index.html =404;
    }
    location ^~ /en/ {
        include /etc/nginx/snippets/pi2web-site-security-headers.conf;
        add_header Content-Language "en" always;
        add_header Cache-Control "public, max-age=300";
        limit_req zone=pi2web_site_reads burst=20 nodelay;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/pi2web-site-security-headers.conf;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }

    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
