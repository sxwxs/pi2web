openapi: 3.1.0
info: {title: Remote Pi API, version: 2.0.0}
servers: [{url: /api/v1}]
security: [{bearerAuth: []}]
paths:
  /system/status:
    get: {operationId: systemStatus, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /workspaces:
    get: {operationId: listWorkspaces, responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {operationId: addWorkspace, requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /workspaces/{id}/tree:
    get: {operationId: workspaceTree, parameters: [{$ref: '#/components/parameters/Id'}, {name: path, in: query, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /workspaces/{id}/stat:
    get: {operationId: workspaceStat, parameters: [{$ref: '#/components/parameters/Id'}, {name: path, in: query, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /workspaces/{id}/file:
    get: {operationId: workspaceFile, parameters: [{$ref: '#/components/parameters/Id'}, {name: path, in: query, schema: {type: string}}, {name: offset, in: query, schema: {type: integer}}, {name: limit, in: query, schema: {type: integer, maximum: 1048576}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /sessions:
    get: {operationId: listSessions, parameters: [{name: workspaceId, in: query, required: true, schema: {type: string}}, {name: path, in: query, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /agents:
    get: {operationId: listAgents, responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {operationId: createAgent, requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /agents/{id}/timeline:
    get: {operationId: agentTimeline, description: 'Older history as display items (see timelineItem in websocket.schema.json): about `limit` items before item `before`, never splitting a tool call from its result. Data {sessionId, items, total, start, hasMore}. Viewers get the newest page from the WebSocket focus snapshot. 404 when `before` is not on the current branch.', parameters: [{$ref: '#/components/parameters/Id'}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}, {name: before, in: query, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /agents/{id}/sessions/{sessionId}/items/{itemId}:
    get: {operationId: agentTimelineItem, description: 'Full body of one timeline item, data {id, body}. Items never change, so it is served with Cache-Control private, max-age=31536000, immutable. 404 when the Agent is no longer on that session or branch.', parameters: [{$ref: '#/components/parameters/Id'}, {name: sessionId, in: path, required: true, schema: {type: string}}, {name: itemId, in: path, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /agents/{id}/system-prompt:
    get: {operationId: getAgentSystemPrompt, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {operationId: changeAgentSystemPrompt, description: 'Only before the first conversation message; body {templateId?: string}, empty ID selects the Pi default.', parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /sotto-stt:
    get: {operationId: getSottoSttSettings, description: 'Backend-wide Sotto transcription setting; disabled by default, endpoint defaults to http://127.0.0.1:8766.', responses: {'200': {$ref: '#/components/responses/Success'}}}
    put: {operationId: setSottoSttSettings, description: 'Body {enabled: boolean, endpoint: http://127.0.0.1:<port>}; probes local Sotto capabilities before enabling. Requires full access token.', requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /agents/{id}/transcribe:
    post: {operationId: transcribeAgentDraft, description: 'When Sotto is enabled, body is 16 kHz mono float32 little-endian PCM (application/octet-stream; max 60 s); otherwise uses configured OpenAI-compatible STT audio. Returns {data:{text}} without submitting to the Agent.', parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /agents/{id}/queue/move:
    post: {operationId: moveQueuedMessage, description: 'Move one unconsumed message to the other queue during a run. Body {from: steering|followUp, index: integer, expected: string}; rejects stale entries.', parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /agents/{id}/{action}:
    get: {operationId: getAgentResource, parameters: [{$ref: '#/components/parameters/Id'}, {name: action, in: path, required: true, schema: {enum: [state,capabilities,session]}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {operationId: agentCommand, parameters: [{$ref: '#/components/parameters/Id'}, {name: action, in: path, required: true, schema: {enum: [prompt,steer,follow-up,abort,compact,model,thinking,session-name,navigate,fork,extension-response]}}], requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /draft:
    post: {operationId: draftText, description: 'Insert text into the currently displayed Web UI input box on this backend, without sending it to an Agent. Body {text, mode?: append|replace, source?}; explicit agent/slot targets are rejected. Pending text is kept in memory until a page acknowledges it.', requestBody: {$ref: '#/components/requestBodies/Json'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
  requestBodies:
    Json: {required: true, content: {application/json: {schema: {type: object}}}}
  responses:
    Success: {description: Successful response, content: {application/json: {schema: {type: object, required: [data], properties: {data: {}}}}}}
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties: {error: {type: object, required: [code,message,requestId], properties: {code: {type: string}, message: {type: string}, requestId: {type: string}}}}
