<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote Pi</title><link rel="stylesheet" href="styles.css"></head>
<body><header><h1>Remote Pi</h1><label>API 地址 <input id="api" placeholder="http://127.0.0.1:8787"></label><button id="connect">连接</button><span id="status">未连接</span></header>
<main><aside><section><h2>Workspace</h2><div class="row"><button id="refreshWs">刷新</button><button id="addWs">添加</button></div><select id="workspaces" size="4"></select><div class="pathbar"><button id="treeUp" title="返回上级">↑</button><button id="treeRoot" title="Workspace 根目录">⌂</button><span id="treePath">.</span></div><div id="tree"></div><pre id="file"></pre></section><section><h2>Agents</h2><label class="cwd-field">Agent 工作路径<input id="agentCwd" value="." title="相对于当前 workspace 的目录"></label><button id="newAgent">新建 Agent</button><div id="agents"></div></section></aside><article><div class="toolbar"><strong id="agentTitle">请选择 Agent</strong><button id="abort">Abort</button><button id="clear">清空显示</button></div><div id="messages" aria-live="polite"></div><form id="prompt"><textarea id="input" placeholder="输入 prompt，Ctrl/⌘+Enter 发送"></textarea><button>发送</button></form></article></main><div id="contextMenu" class="context-menu" hidden><button id="menuSetCwd">设为 Agent 工作路径</button><button id="menuMention">在输入框中 @ 此项</button></div><script src="app.js"></script></body></html>
